plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace 'com.dreamcoat.watch'
    compileSdk 37

    defaultConfig {
        // Must match the phone app: the Wearable Data Layer only connects apps with the same
        // package name and signing key.
        applicationId 'com.dreamcoat'
        minSdk 30
        targetSdk 34
        versionCode 3
        versionName '1.1.0'
    }

    // Same release key as the phone app (see ../dreamcoat/build.gradle).
    signingConfigs {
        release {
            if (project.hasProperty('DREAMCOAT_STORE_FILE')) {
                storeFile file(DREAMCOAT_STORE_FILE)
                storePassword DREAMCOAT_STORE_PASSWORD
                keyAlias DREAMCOAT_KEY_ALIAS
                keyPassword DREAMCOAT_KEY_PASSWORD
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (project.hasProperty('DREAMCOAT_STORE_FILE')) {
                signingConfig signingConfigs.release
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures {
        compose true
    }
}

dependencies {
    implementation 'androidx.wear.compose:compose-material3:1.7.1'
    implementation 'androidx.wear.compose:compose-foundation:1.7.1'
    implementation 'androidx.activity:activity-compose:1.13.0'
    implementation 'androidx.wear:wear-ongoing:1.1.0'
    implementation 'androidx.core:core-ktx:1.16.0'
    implementation 'com.google.android.gms:play-services-wearable:19.0.0'
}
