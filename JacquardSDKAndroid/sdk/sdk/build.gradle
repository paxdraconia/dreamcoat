// Dreamcoat: modernized for AGP 8 / compileSdk 34 / JDK 17. Built from the Dreamcoat root project.
// Maven publishing tasks were removed (they referenced AGP 4 task names).
buildscript {
    apply from: '../../version.gradle'
}

plugins {
    id 'com.android.library'
}

android {
    namespace 'com.google.android.jacquard.sdk'
    compileSdk 34

    defaultConfig {
        minSdk 23
        targetSdk 34
        buildConfigField("String", "SDK_VERSION", "\"" + project.versionName + "\"")
        buildConfigField("String", 'CLOUD_ENDPOINT_PRODUCTION', "\"https://jacquard.googleapis.com\"")
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildFeatures {
        buildConfig true
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    testOptions {
        unitTests.returnDefaultValues = true
    }
    lint {
        abortOnError false
    }
    packaging {
        resources {
            excludes += [
                'META-INF/proguard/androidx-annotations.pro',
                'META-INF/gradle/incremental.annotation.processors',
                'META-INF/DEPENDENCIES', 'META-INF/LICENSE', 'META-INF/LICENSE.txt',
                'META-INF/license.txt', 'META-INF/NOTICE', 'META-INF/NOTICE.txt',
                'META-INF/notice.txt', 'META-INF/ASL2.0', 'META-INF/INDEX.LIST',
            ]
        }
    }
}

dependencies {
    api fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'androidx.appcompat:appcompat:1.3.1'
    implementation 'com.google.auto.value:auto-value-annotations:1.7.4'
    implementation 'com.google.code.gson:gson:2.8.7'
    implementation 'com.google.guava:guava:30.1-android'
    api 'com.google.protobuf:protobuf-java:3.21.1'
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-moshi:2.9.0'
    implementation 'com.ryanharter.auto.value:auto-value-gson-runtime:1.3.1'
    annotationProcessor 'com.google.auto.value:auto-value:1.7.4'
    annotationProcessor 'com.ryanharter.auto.value:auto-value-gson-factory:1.3.1'
    annotationProcessor 'com.ryanharter.auto.value:auto-value-gson-extension:1.3.1'
    testImplementation 'androidx.test.ext:junit:1.1.3'
    testImplementation 'com.google.truth:truth:1.1.2'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.4'
    testImplementation 'org.mockito:mockito-core:3.7.7'
}
